<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIT Campus Navigator / KIT 楼号查找器</title>
<meta name="description" content="Quickly locate any KIT building by its number (e.g. 10.81, 50.20) or hall name, with one-tap Google and Apple Maps navigation.">
<meta property="og:title" content="KIT Campus Navigator">
<meta property="og:description" content="Find any KIT building by number and navigate instantly.">
<meta property="og:type" content="website">
<style>
:root{
  --kit-brand:#057a75;
  --kit-brand-hover:#035f5b;
  --kit-brand-light:#eaf6f5;
  --kit-brand-border:#8cd3cf;
  --bg-page:#f8fafc;
  --bg-card:#ffffff;
  --border-light:#e2e8f0;
  /* High contrast text: crisp black and deep charcoal */
  --text-main:#0f172a;
  --text-sub:#334155;
  --text-muted:#475569;
  --apple-btn:#1c1c1e;
  --nav-btn:#057a75;
  --map-btn:#0e8d87;
  --status-bg:#e6f5f4;
  --status-border:#9fd4d1;
  --status-text:#0c4a47;
}

@media(prefers-color-scheme:dark){
  :root{
    --kit-brand:#14b8a6;
    --kit-brand-hover:#0d9488;
    --kit-brand-light:#132e2c;
    --kit-brand-border:#1d5956;
    --bg-page:#121212;
    --bg-card:#1e1e1e;
    --border-light:#2e2e2e;
    /* High contrast text: bright white and light grays */
    --text-main:#ffffff;
    --text-sub:#f3f4f6;
    --text-muted:#d1d5db;
    --apple-btn:#2d2d30;
    --nav-btn:#057a75;
    --map-btn:#0d8782;
    --status-bg:#122928;
    --status-border:#1a4d4a;
    --status-text:#e2faf8;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  margin:0;padding:16px;
  background:var(--bg-page);
  color:var(--text-main);
  min-height:100vh;
}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-0.3px;color:var(--text-main)}
.lang{display:flex;gap:6px;flex-shrink:0}
.lang button{
  padding:6px 12px;border-radius:20px;
  border:1.5px solid var(--kit-brand);
  background:var(--bg-card);
  color:var(--kit-brand);
  font-size:13px;cursor:pointer;font-weight:600;
  transition:all 0.15s ease;
}
.lang button.on{background:var(--kit-brand);color:#ffffff}
.lang button:hover:not(.on){background:var(--kit-brand-light)}

p.sub{color:var(--text-sub);margin:0 0 12px;font-size:13.5px;line-height:1.55}

.status{
  font-size:12.5px;color:var(--status-text);
  background:var(--status-bg);
  border:1px solid var(--status-border);
  border-radius:9px;padding:8px 12px;
  margin-bottom:12px;line-height:1.45;
  font-weight:500;
}
.status.offline{background:#2a2310;border-color:#5c4c15;color:#fef08a}

.search-wrap{position:relative;margin-bottom:10px}
input[type=search]{
  width:100%;padding:13px 44px 13px 14px;
  font-size:16.5px;
  border:2px solid var(--kit-brand);
  border-radius:12px;outline:none;
  background:var(--bg-card);color:var(--text-main);
  transition:border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance:none;appearance:none;
}
input[type=search]:focus{
  border-color:var(--kit-brand-hover);
  box-shadow:0 0 0 3px rgba(5,122,117,0.22);
}
input[type=search]::-webkit-search-cancel-button{display:none}
.clear-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:18px;line-height:1;
  padding:6px;display:none;
}
.clear-btn.visible{display:block}

.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.fbtn{
  border:1.5px solid var(--border-light);
  background:var(--bg-card);color:var(--text-sub);
  border-radius:20px;padding:6px 13px;
  font-size:13px;cursor:pointer;font-weight:600;
  transition:all 0.15s;
}
.fbtn.on{border-color:var(--kit-brand);background:var(--kit-brand);color:#ffffff}
.fbtn:hover:not(.on){border-color:var(--kit-brand);color:var(--kit-brand)}

/* Quick tags: hidden immediately when search box has text */
.chips-section{margin-bottom:8px;transition:opacity 0.2s}
.chips-section.hidden{display:none}
.chips-title{font-size:12.5px;color:var(--text-muted);margin:0 0 6px 2px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--border-light);
  background:var(--bg-card);color:var(--text-main);
  border-radius:18px;padding:6px 12px;
  font-size:13px;cursor:pointer;font-weight:600;
  transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;
}
.chip strong{color:var(--kit-brand)}
.chip:hover{border-color:var(--kit-brand);background:var(--kit-brand-light)}
.chip small{color:var(--text-sub);font-weight:500}

.count{font-size:13px;color:var(--text-sub);margin:8px 0 4px 2px;font-weight:500}

.card{
  background:var(--bg-card);
  border:1px solid var(--border-light);
  border-radius:12px;padding:14px 15px;margin:9px 0;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
}
.card h3{margin:0 0 5px;font-size:16.5px;line-height:1.35;font-weight:700;color:var(--text-main)}
.meta{color:var(--text-sub);font-size:13.5px;line-height:1.6;font-weight:500}
.meta .coords{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;color:var(--text-muted);margin-top:3px;font-weight:500}

.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 13px;border-radius:8px;text-decoration:none;
  font-size:13.5px;font-weight:600;transition:opacity 0.15s;
}
a.btn:hover{opacity:0.9}
a.g{background:var(--nav-btn);color:#ffffff}
a.g2{background:var(--map-btn);color:#ffffff}
a.ap{background:var(--apple-btn);color:#ffffff}
a.k{background:var(--kit-brand-light);color:var(--kit-brand);border:1px solid var(--kit-brand-border)}
a.o{background:rgba(128,128,128,0.15);color:var(--text-main);border:1px solid var(--border-light)}

button.copybtn{
  padding:8px 12px;border-radius:8px;
  border:1px solid var(--border-light);
  background:var(--bg-card);color:var(--text-sub);
  font-size:13px;cursor:pointer;font-weight:600;
  transition:all 0.15s;
}
button.copybtn:hover{border-color:var(--kit-brand);color:var(--kit-brand)}
button.copybtn.ok{background:var(--kit-brand-light);border-color:var(--kit-brand);color:var(--kit-brand)}

.note{
  font-size:13px;color:var(--text-sub);line-height:1.6;
  background:var(--bg-card);
  border:1px solid var(--border-light);
  border-left:4px solid var(--kit-brand);
  border-radius:10px;padding:11px 14px;margin-top:16px;
}
footer{
  font-size:12px;color:var(--text-muted);line-height:1.6;
  margin-top:18px;padding-top:12px;border-top:1px solid var(--border-light);
}
</style>
</head>
<body>

<div class="top">
  <h1 id="title">KIT Campus Navigator</h1>
  <div class="lang">
    <button id="btn-en" class="on">English</button>
    <button id="btn-zh">中文</button>
  </div>
</div>
<p class="sub" id="sub"></p>
<div class="status" id="status"></div>

<div class="search-wrap">
  <input id="q" type="search" autocomplete="off" spellcheck="false" autofocus>
  <button class="clear-btn" id="clear-btn" aria-label="Clear">✕</button>
</div>

<div class="filters" id="filters"></div>

<div class="chips-section" id="chips-section">
  <div class="chips-title" id="chips-title">Frequent Landmarks:</div>
  <div class="chips" id="chips"></div>
</div>

<div class="count" id="count"></div>
<div id="results"></div>
<div class="note" id="note"></div>
<footer id="footer"></footer>

function norm(s) {
  return (s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ß/g, 'ss').replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u');
}
function canonNum(s) {
  let t = norm(s).trim().replace(/[_\-\s]/g, '');
  t = t.replace(/^(geb|gebaeude|building|horsaal|hs|raum|room)\.?/, '');
  if (/^\d{4}$/.test(t)) t = t.slice(0,2) + '.' + t.slice(2);
  if (/^\d{2}\.\d{1}$/.test(t)) t = t + '0';
  return t;
}
function kitId(title) {
  const m = title.match(/\((\d[\d.]+)\)/);  if (m) return m[1];
  const m2 = title.match(/^(\d[\d.]+)/);    if (m2) return m2[1];
  return title;
}
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function card(it, overrideTitle) {
  const shown  = overrideTitle || (lang === 'en' && it.id && EN_TITLES[it.id] ? EN_TITLES[it.id] : it.t);
  const key    = kitId(it.t);
  const nav    = `https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}`;
  const gmaps  = `https://www.google.com/maps/search/?api=1&query=${it.lat},${it.lng}`;
  const apple  = `https://maps.apple.com/?daddr=${it.lat},${it.lng}`;
  const kitUrl = `https://www.kit.edu/campusplan/map.php?id=${encodeURIComponent(key)}`;
  const osm    = `https://www.openstreetmap.org/?mlat=${it.lat}&mlon=${it.lng}#map=18/${it.lat}/${it.lng}`;
  const a      = addr[key] || it.addr || '';
  const cat    = T()[it.c] || it.c;

  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <h3>${escHtml(shown)}</h3>
    <div class="meta">${escHtml(cat)}${a ? '<br>' + escHtml(a) : ''}
      <div class="coords">${it.lat}, ${it.lng}</div>
    </div>
    <div class="btns">
      <a class="btn g"  href="${nav}"   target="_blank" rel="noopener">${T().nav}</a>
      <a class="btn g2" href="${gmaps}" target="_blank" rel="noopener">${T().gmaps}</a>
      <a class="btn ap" href="${apple}" target="_blank" rel="noopener">${T().apple}</a>
      <a class="btn k"  href="${kitUrl}"target="_blank" rel="noopener">${T().kit}</a>
      <a class="btn o"  href="${osm}"   target="_blank" rel="noopener">${T().osm}</a>
      <button class="copybtn" data-lat="${it.lat}" data-lng="${it.lng}">${T().copy}</button>
    </div>`;
  return div;
}

// ─── Event Delegation: Copy Button ─────────────────────────────────────────
document.addEventListener('click', e => {
  const btn = e.target.closest('.copybtn');
  if (!btn) return;
  const lat = btn.dataset.lat, lng = btn.dataset.lng;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(`${lat}, ${lng}`).then(() => {
      btn.textContent = T().copied;
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = T().copy; btn.classList.remove('ok'); }, 1800);
    });
  }
});

// ─── Search Scoring ────────────────────────────────────────────────────────
function score(it, query) {
  const title = norm(it.t) + (it.id && EN_TITLES[it.id] ? ' ' + norm(EN_TITLES[it.id]) : '');
  const qn    = norm(query);
  const num   = canonNum(query);
  const id    = kitId(it.t);
  if (id === num) return 100;
  if (title === qn) return 95;
  if (title.includes('(' + num + ')')) return 90;
  if (title.startsWith(qn)) return 80;
  if (title.includes(qn)) return 60;
  if (canonNum(title).includes(num) && num.length >= 2) return 50;
  return 0;
}

function doSearch() {
  const s = qEl.value.trim();
  clearBtn.classList.toggle('visible', s.length > 0);

  // KEY FIX: Instantly hide chips section when user is searching
  if (s.length > 0) {
    chipsSection.classList.add('hidden');
  } else {
    chipsSection.classList.remove('hidden');
  }

  const pool = data.filter(d => catFilter === 'all' || d.c === catFilter);
  resEl.innerHTML = '';

  if (!s) {
    cntEl.textContent = '';
    return;
  }

  const scored = pool
    .map(d => ({d, sc: score(d, s)}))
    .filter(x => x.sc > 0)
    .sort((a, b) => b.sc - a.sc || a.d.t.localeCompare(b.d.t));

  const list = scored.map(x => x.d);
  cntEl.textContent = list.length
    ? (list.length > 20 ? T().found20(list.length) : T().found(list.length))
    : T().none;

  list.slice(0, 20).forEach(it => resEl.appendChild(card(it)));
}

    chipsEl.appendChild(b);
  });
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('kit-nav-lang', l); } catch(e) {}
  renderChrome();
  doSearch();
}
document.getElementById('btn-zh').onclick = () => setLang('zh');
document.getElementById('btn-en').onclick = () => setLang('en');

qEl.addEventListener('input', doSearch);
clearBtn.addEventListener('click', () => { qEl.value = ''; qEl.focus(); doSearch(); });

// ─── Live Data Loading ─────────────────────────────────────────────────────
function parseKitJS(text) {
  const m = text.match(/var cp_repository_data\s*=\s*(\[.*\]);?\s*$/s);
  if (!m) throw new Error('parse failed');
  const arr = JSON.parse(m[1]);
  return arr.map(d => ({
    t:   d.title,
    c:   d.category,
    lat: parseFloat(d.positionList[0][0]),
    lng: parseFloat(d.positionList[0][1]),
    id:  d.id
  }));
}

async function fetchLive() {
  try {
    const [rde, ren] = await Promise.all([fetch(KIT_DE), fetch(KIT_EN)]);
    if (!rde.ok || !ren.ok) throw new Error('HTTP ' + rde.status + '/' + ren.status);
    const de = parseKitJS(await rde.text());
    const en = parseKitJS(await ren.text());
    en.forEach(e => { EN_TITLES[e.id] = e.t; });
    data      = MANUAL.concat(de);
    live      = true;
    liveCount = de.length;
  } catch(e) {
    live = false;
  }
  renderChrome();
  doSearch();
}

renderChrome();
doSearch();
fetchLive();
</script>
